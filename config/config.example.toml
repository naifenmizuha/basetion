[openai]
model = "gpt-5"
api_key_env = "OPENAI_API_KEY"
base_url = "https://api.openai.com/v1"
custom_headers = {}
disable_response_storage = false
reasoning_effort = "high"
reasoning_summary = "detailed"
context_window_tokens = 128000

[database.run]
url = "postgres://basetion:basetion@localhost:5432/basetion?sslmode=disable&connect_timeout=5"

[database.dev]
url = "postgres://basetion:basetion@localhost:5432/basetion_dev?sslmode=disable&connect_timeout=5"

[session]
dir = ".basetion/sessions"

[user]
name = "Basetion 用户"

[log]
file = ".basetion/basetion.log"

[agent]
max_iterations = 20
unsafe_debug_data = false
