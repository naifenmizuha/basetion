[openai]
model = "gpt-5"
api_key_env = "OPENAI_API_KEY"
base_url = "https://api.openai.com/v1"
reasoning_effort = "high"
reasoning_summary = "detailed"

[database.run]
url = "postgres://basetion:basetion@localhost:5432/basetion?sslmode=disable&connect_timeout=5"

[database.dev]
url = "postgres://basetion:basetion@localhost:5432/basetion_dev?sslmode=disable&connect_timeout=5"

[session]
dir = ".basetion/sessions"

[agent]
max_iterations = 20
unsafe_debug_data = false
