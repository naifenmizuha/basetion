[openai]
model = "gpt-5"
api_key_env = "OPENAI_API_KEY"
base_url = "https://api.openai.com/v1"

[database.run]
mode = "fixed"
url = "postgres://basetion:basetion@localhost:5432/basetion?sslmode=disable&connect_timeout=5"

[database.dev]
mode = "temporary"
admin_url = "postgres://basetion:basetion@localhost:5432/postgres?sslmode=disable&connect_timeout=5"
temporary_prefix = "basetion_test"

[session]
dir = ".basetion/sessions"

[agent]
max_iterations = 20
unsafe_debug_data = false
