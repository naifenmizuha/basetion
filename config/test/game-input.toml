# 通过 `just test config/test/game-input.toml` 运行。

[[test.game-input]]
prompt = """
请帮我记录下面这场曹魏队与蜀汉队的三局制棒球比赛。比赛已经结束，我确认把整场比赛、双方先发阵容以及比赛过程写入系统，请直接执行，不必再次询问。

比赛于 2026 年 9 月 1 日晚上 7 点在许都棒球场开打，曹魏队是主队，蜀汉队是客队。

曹魏队先发打序：
1 棒，1 号曹操，一垒手；
2 棒，3 号夏侯惇，二垒手；
3 棒，4 号许褚，捕手；
4 棒，5 号张辽，外野手；
5 棒，6 号徐晃，外野手；
6 棒，7 号张郃，外野手；
7 棒，8 号曹仁，三垒手；
8 棒，9 号司马懿，游击手；
9 棒，2 号荀彧，投手。

蜀汉队先发打序：
1 棒，18 号刘备，一垒手；
2 棒，25 号关羽，二垒手；
3 棒，2 号张飞，捕手；
4 棒，7 号赵云，外野手；
5 棒，9 号马超，外野手；
6 棒，31 号黄忠，外野手；
7 棒，5 号魏延，三垒手；
8 棒，6 号姜维，游击手；
9 棒，17 号诸葛亮，投手。

比赛过程如下。每个打席都按实际投球顺序描述。未提及球种、球速和进垒区域，这些字段留空。

一局上半，曹魏队由荀彧投球，蜀汉队进攻。

刘备：看球好球；坏球；界外球；坏球；界外球；打进场内，成为中外野一垒安打，刘备上一垒。

关羽：坏球；挥空；界外球；坏球；挥空，三振出局。许褚完成刺杀，一人出局，刘备仍在一垒。

张飞：看球好球；坏球；打进场内，成为左外野二垒安打。刘备从一垒得分，张飞停在二垒；这是荀彧的自责分，张飞获得一分打点，蜀汉队 1:0 领先。

赵云：坏球；看球好球；打进场内，成为右外野飞球，被张郃接杀。两人出局，张飞仍在二垒。

马超：挥空；坏球；看球好球；界外球；打进场内，成为游击方向滚地球。司马懿助杀，曹操在一垒刺杀马超，三人出局，张飞残垒。

一局下半，蜀汉队由诸葛亮投球，曹魏队进攻。

曹操：坏球；看球好球；坏球；界外球；坏球；界外球；坏球，曹操保送上一垒。

夏侯惇：看球好球；坏球；挥空；坏球；界外球；挥空，三振出局。张飞完成刺杀，一人出局，曹操仍在一垒。

许褚：坏球；坏球；看球好球；打进场内，成为右外野一垒安打。曹操推进到二垒，许褚上一垒。

张辽：界外球；坏球；打进场内，成为游击方向滚地球。姜维传二垒让许褚封杀出局，关羽再传一垒封杀张辽，完成双杀；这一球产生第二、第三个出局，曹操留在二垒残垒。第一局结束，蜀汉队 1:0 领先。

二局上半，荀彧继续投球。

黄忠：看球好球；坏球；坏球；坏球；界外球；界外球；坏球，黄忠保送上一垒。

魏延：坏球；界外球；打进场内，成为游击方向滚地球。司马懿传二垒封杀黄忠，夏侯惇再传一垒封杀魏延，完成双杀，两人出局、垒上无人。

姜维：坏球；看球好球；坏球；挥空；界外球；看球好球，三振出局。许褚完成刺杀，三人出局。

二局下半，诸葛亮继续投球。

徐晃：看球好球；界外球；坏球；界外球；打进场内，成为左外野二垒安打，徐晃站上二垒。

张郃：坏球；坏球；打进场内，成为中外野一垒安打。徐晃从二垒得分，张郃停在一垒；这是诸葛亮的自责分，张郃获得一分打点，比分变成 1:1。

曹仁：挥空；坏球；界外球；界外球；坏球；挥空，三振出局。张飞完成刺杀，一人出局，张郃仍在一垒。

司马懿：坏球；看球好球；坏球；打进场内，成为中外野飞球，被黄忠接杀。两人出局，张郃仍在一垒。

荀彧：看球好球；坏球；界外球；坏球；打进场内，成为右外野一垒安打。张郃从一垒推进到三垒，荀彧上一垒。

曹操第二次打击：坏球；看球好球；界外球；坏球；打进场内，成为游击方向滚地球。姜维助杀，刘备在一垒刺杀曹操，三人出局，张郃和荀彧残垒。两局结束，双方 1:1。

三局上半，荀彧继续投球。

姜维：坏球；看球好球；坏球；打进场内，成为中外野一垒安打，姜维上一垒。

诸葛亮：坏球；触击进场。荀彧处理后传给曹操，在一垒刺杀诸葛亮；姜维推进到二垒，这是一记牺牲触击，一人出局。

刘备第二次打击：看球好球；坏球；挥空；坏球；界外球；打进场内，成为左外野二垒安打。姜维从二垒得分，刘备停在二垒；这是荀彧的自责分，刘备获得一分打点，蜀汉队 2:1 领先。

关羽第二次打击：看球好球；坏球；打进场内，成为右外野飞球，被张郃接杀。两人出局，刘备仍在二垒。

张飞第二次打击：坏球；界外球；坏球；看球好球；界外球；打进场内，成为游击方向滚地球。司马懿助杀，曹操在一垒刺杀张飞，三人出局，刘备残垒。

三局下半，曹魏队最后一次进攻，诸葛亮继续投球。

夏侯惇第二次打击：坏球；看球好球；界外球；坏球；界外球；看球好球，三振出局。张飞完成刺杀，一人出局。

许褚第二次打击：坏球；挥空；坏球；界外球；界外球；打进场内，成为左外野阳春本垒打。许褚得分；这是诸葛亮的自责分，许褚获得一分打点，比分变成 2:2。

张辽第二次打击：看球好球；坏球；坏球；打进场内，成为中外野一垒安打，张辽上一垒。

徐晃第二次打击：界外球；坏球；挥空；坏球；界外球；打进场内，成为右外野二垒安打。张辽从一垒跑到三垒，徐晃停在二垒。

张郃第二次打击：坏球；看球好球；坏球；界外球；打进场内，成为中外野牺牲飞球，被黄忠接杀，形成第二个出局。张辽从三垒得再见分，徐晃留在二垒；这是诸葛亮的自责分，张郃获得一分打点。曹魏队以 3:2 获胜，比赛立即结束。
"""
expect_tools = ["team_describe", "team_modify"]
expect_skills = ["record-game"]
