version: "2"
sql:
  - engine: postgresql
    schema: sql/migrations
    queries: sql/queries
    gen:
      go:
        package: sqlcgen
        out: src/internal/infra/postgres/sqlcgen
        sql_package: pgx/v5
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type:
              type: string
          - db_type: pg_catalog.uuid
            go_type:
              type: string
